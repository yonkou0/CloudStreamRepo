name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build plugins and assemble repository
        run: |
          chmod +x gradlew
          pwsh -File tools/build-repo.ps1

      - name: Commit updated plugins
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # Ignore file-mode changes (the `chmod +x gradlew` above would otherwise
          # mark gradlew as modified on Linux runners and dirty the working tree).
          git config --local core.fileMode false
          git add builds plugins.json repo.json
          # Only commit when something is actually STAGED. Checking
          # `git status --porcelain` is wrong: it also reports unstaged changes
          # (e.g. the gradlew mode change), which makes the branch look dirty even
          # when there is nothing to commit, and `git commit` then exits 1.
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build $GITHUB_SHA [skip ci]"
            git push
          fi
